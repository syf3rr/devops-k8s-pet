name: Application CI/CD (GitOps)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/app-ci-cd.yaml'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-k8s-pet-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/devops-k8s-pet-backend:latest

  build-and-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-k8s-pet-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/devops-k8s-pet-frontend:latest

  update-helm-manifests:
    name: Update Helm Values for Argo CD
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Image Tags in Helm values.yaml
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval '.backend.image.tag = "${{ github.sha }}"' -i deploy/helm/demo-app/values.yaml
            yq eval '.frontend.image.tag = "${{ github.sha }}"' -i deploy/helm/demo-app/values.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/demo-app/values.yaml
          git diff-index --quiet HEAD || git commit -m "ci(helm): update app image tags to ${{ github.sha }} [skip ci]"
          git push